engine:
  speed: 4
  autoclose: False
recorder:
  file: record/test.pickle
  record:
    - trailmarker
    - preprocessor
    - hiddenmarkov
    - detector
  replay:
    - trailmarker
    - preprocessor
    - hiddenmarkov
    - detector
webcam:
  deviceIndex: 0
  width: 640
  height: 360
  dtype: u8
  flip: True
preprocessor:
  finger_idx: 8
  # Hysterese fuer die Gesten-Segmentierung.
  # WICHTIG: Die Start-Schwelle muss GROESSER sein als die Stopp-Schwelle.
  # Sonst wird die Geste bei jeder kleinen Tempo-Delle sofort beendet und in
  # winzige Fetzen zerhackt -- der Klassifikator sieht dann nur Teil-Gesten und
  # gibt fast immer "?" aus. Mit niedriger Stopp-Schwelle endet die Geste erst,
  # wenn die Hand nahezu steht oder aus dem Bild genommen wird (wie beim Training).
  min_speed_corner: 0.005    # Start: ab dieser Bewegung beginnt das Sammeln
  reset_speed_corner: 0.001  # Stopp: erst wenn die Hand fast steht, endet die Geste
  # stop_hold: So viele langsame Frames HINTEREINANDER muessen kommen, bevor die
  # Geste als beendet gilt (Entprellen). Verhindert, dass ein kurzes Abbremsen an
  # einer Ecke (z. B. bei M, W, Z) den Buchstaben mittendrin abschneidet.
  stop_hold: 4
  # buffer_size: Wie viele Fingerpunkte maximal gesammelt werden. Bei ~30 fps sind
  # 250 Punkte ca. 8 Sekunden -- genug, damit auch ein gross/langsam gemalter
  # Buchstabe komplett hineinpasst und der Anfang nicht abgeschnitten wird.
  buffer_size: 250
  max_lost: 10
  min_steps: 15
hiddenmarkov:
  score_threshold: -20.0
  # margin_threshold: Mindest-Abstand zwischen bestem und zweitbestem Buchstaben.
  # 0.5 war zu streng und hat selbst korrekte Top-Tipps als "?" verworfen. 0.1
  # zeigt den besten Tipp an und behaelt "?" nur fuer wirklich mehrdeutige Gesten.
  margin_threshold: 0.1
  unknown_label: "?"
trailmarker:
  finger_idx: 8
  max_lost: 10
  max_trail_length: 300
